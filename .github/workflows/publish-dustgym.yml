name: Publish dustgym to PyPI

# Trusted Publishing (OIDC) — no API token. Fires on a published GitHub Release (tag the version
# first, e.g. v0.1.0, then publish the release) or manually via workflow_dispatch.
# PyPI "pending publisher" form maps to this file:
#   Repository name: roversim   |   Workflow name: publish-dustgym.yml   |   Environment name: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build            # -> dist/dustgym-*.tar.gz + dist/dustgym-*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment: pypi              # must match the Environment name in the PyPI publisher config
    permissions:
      id-token: write             # REQUIRED for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
