[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-sim-gym"
version = "0.1.0"
description = "Gymnasium environments for lunar surface vehicles and autonomous construction, on a mass-conserving terramechanics authority (IPEx / Lunar Autonomy Challenge lineage)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["gymnasium", "reinforcement-learning", "lunar", "rover", "terramechanics", "isru", "robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: Robot Framework",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
rl = ["torch", "stable-baselines3>=2.0"]   # PPO / model-free baselines
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jmccardle/roversim"
Source = "https://github.com/jmccardle/roversim"

# Forward-compatible Gymnasium plugin hook (for versions that auto-load entry points). Current
# Gymnasium needs `import lunar_sim_gym` (registers on import) before `gymnasium.make("Lunar/...")`.
[project.entry-points."gymnasium.envs"]
Lunar = "lunar_sim_gym:register_envs"

[tool.setuptools]
packages = ["terrain_authority", "lunar_sim_gym"]
